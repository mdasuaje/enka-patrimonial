<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#0c1a2b" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta
            name="description"
            content="EDIFICIO ENKA: Bien de Interés Cultural según G.O. N° 39.272 (Providencia IPC N° 019/09). Categoría de 'Lo Construido' (Registro N° 734). Avenida Fermín Toro, San Bernardino, Caracas, 1011. Gestión del inmueble tras el sismo del 24 de Jun 2026. Ante riesgos estructurales, la comunidad ejecuta reparaciones por autogestión (Art. 762 del Código Civil). En búsqueda de apoyo institucional de la Alcaldía de Caracas para restaurar fachadas y resguardar su valor patrimonial."
        />
        <title>ENKA Inspection Hub</title>
        <link rel="manifest" href="manifest.json" />
        <meta name="apple-mobile-web-app-title" content="ENKA Hub" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>"
        />
        <style>
            /* ===== VARIABLES Y BASE ===== */
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                --bg: #0c1a2b;
                --fg: #e8eef4;
                --muted: #6b8ba4;
                --accent: #0ea5e9;
                --accent-hover: #38bdf8;
                --card: #112240;
                --border: #1e3a5f;
                --error: #ef4444;
                --success: #22c55e;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f0f5fa;
                    --fg: #0f1d2e;
                    --muted: #4a6a85;
                    --card: #ffffff;
                    --border: #d1e0ed;
                }
            }
            html,
            body {
                height: 100%;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: var(--bg);
                color: var(--fg);
                line-height: 1.6;
            }
            a {
                color: var(--accent);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }

            /* ===== WEB COMPONENT: enka-blind-gate ===== */
            enka-blind-gate {
                display: block;
                isolation: isolate;
            }
            /* Estado oculto por defecto (fuera del DOM visual) */
            enka-blind-gate[estado="oculto"] {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }
            enka-blind-gate[estado="visible"] {
                position: relative;
                width: auto;
                height: auto;
                padding: 2rem;
                margin: 1rem 0;
            }

            /* ===== LAYOUT PRINCIPAL ===== */
            .app {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }
            header {
                background: var(--card);
                border-bottom: 1px solid var(--border);
                padding: 1rem;
                position: sticky;
                top: 0;
                z-index: 100;
            }
            .header-inner {
                max-width: 720px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 1rem;
                flex-wrap: wrap;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-weight: 700;
                font-size: 1.1rem;
                color: var(--fg);
            }
            .brand svg {
                width: 28px;
                height: 28px;
                color: var(--accent);
            }
            .status-badge {
                font-size: 0.7rem;
                padding: 0.2rem 0.5rem;
                border-radius: 999px;
                background: var(--accent);
                color: #001524;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            main {
                flex: 1;
                max-width: 720px;
                width: 100%;
                margin: 0 auto;
                padding: 1.5rem 1rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }

            /* ===== TABS ===== */
            .tabs {
                display: flex;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }
            .tab-btn {
                flex: 1;
                padding: 0.875rem 1rem;
                background: transparent;
                border: none;
                color: var(--muted);
                font-weight: 600;
                font-size: 0.9rem;
                cursor: pointer;
                transition: all 0.2s;
                border-bottom: 3px solid transparent;
            }
            .tab-btn:hover {
                color: var(--fg);
                background: rgba(14, 165, 233, 0.1);
            }
            .tab-btn.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
                background: rgba(14, 165, 233, 0.05);
            }

            /* ===== PANELS ===== */
            .panel {
                display: none;
                padding: 1.5rem;
                animation: fadeIn 0.2s ease;
            }
            .panel.active {
                display: block;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* ===== PUBLIC SECTION (visible por defecto) ===== */
            .public-section {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .info-card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.25rem;
            }
            .info-card h3 {
                font-size: 1rem;
                font-weight: 600;
                margin-bottom: 0.5rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .info-card h3 svg {
                width: 20px;
                height: 20px;
                color: var(--accent);
            }
.info-card p {
                color: var(--muted);
                font-size: 0.9rem;
                line-height: 1.7;
            }

            /* ===== PRIVATE SECTION (dentro de Shadow DOM) ===== */
            /* El auth form y result area quedan encapsulados en el Web Component */
            .auth-form {
                max-width: 380px;
                margin: 0 auto;
            }
            .form-group {
                margin-bottom: 1rem;
            }
            label {
                display: block;
                font-size: 0.85rem;
                font-weight: 500;
                color: var(--fg);
                margin-bottom: 0.375rem;
            }
            .input-wrapper {
                position: relative;
            }
            .input-wrapper svg {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                color: var(--muted);
                pointer-events: none;
            }
            input {
                width: 100%;
                padding: 0.875rem 1rem 0.875rem 44px;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 10px;
                color: var(--fg);
                font-size: 1rem;
                font-family: inherit;
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }
            input:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
            }
            input::placeholder {
                color: var(--muted);
                opacity: 0.7;
            }
            .btn {
                width: 100%;
                padding: 0.875rem;
                background: var(--accent);
                color: #001524;
                border: none;
                border-radius: 10px;
                font-weight: 700;
                font-size: 1rem;
                cursor: pointer;
                transition:
                    background 0.2s,
                    transform 0.1s;
            }
            .btn:hover {
                background: var(--accent-hover);
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            .error-msg {
                color: var(--error);
                font-size: 0.85rem;
                margin-top: 0.5rem;
                text-align: center;
                min-height: 1.25rem;
                display: none;
            }
            .error-msg.visible {
                display: block;
            }
            .result-area {
                display: none;
                margin-top: 1.5rem;
                padding: 1.25rem;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
            }
            .result-area.visible {
                display: block;
            }
            .result-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1rem;
                padding-bottom: 0.75rem;
                border-bottom: 1px solid var(--border);
            }
            .result-header h3 {
                font-size: 1rem;
                font-weight: 600;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            .result-header h3 svg {
                width: 20px;
                height: 20px;
                color: var(--success);
            }
            .btn-ghost {
                padding: 0.5rem 1rem;
                background: transparent;
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 0.85rem;
                cursor: pointer;
                transition: all 0.2s;
            }
.btn-ghost:hover {
                background: var(--border);
                color: var(--fg);
            }

            /* ===== LOADING ===== */
            .loading {
                display: none;
                text-align: center;
                padding: 2rem;
                color: var(--muted);
            }
            .loading.visible {
                display: block;
            }
            .spinner {
                width: 32px;
                height: 32px;
                border: 3px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                margin: 0 auto 1rem;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            footer {
                padding: 1.5rem 1rem;
                text-align: center;
                color: var(--muted);
                font-size: 0.8rem;
                border-top: 1px solid var(--border);
                background: var(--card);
                margin-top: auto;
            }

            /* ===== RESPONSIVE ===== */
            @media (max-width: 480px) {
                .header-inner {
                    flex-direction: column;
                    align-items: flex-start;
                }
                .tabs .tab-btn {
                    padding: 0.75rem 0.5rem;
                    font-size: 0.85rem;
                }
                main {
                    padding: 1rem;
                }
            }

            /* ===== OFFLINE INDICATOR ===== */
            .offline-banner {
                display: none;
                background: #fef3c7;
                color: #92400e;
                padding: 0.75rem 1rem;
                text-align: center;
                font-size: 0.85rem;
                font-weight: 500;
                border-bottom: 1px solid #fcd34d;
            }
            .offline-banner.visible {
                display: block;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="header-inner">
                <div class="brand">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                        />
                        <polyline points="9 22 9 12 15 12 15 22" />
                        <line x1="2" y1="9" x2="22" y2="9" />
                    </svg>
                    <span>ENKA Inspection Hub</span>
                </div>
                <span class="status-badge">BIC G.O. 39.272</span>
            </div>
        </header>

        <main>
            <div id="dossier-nativo-container" class="loading-state">
                Conectando con el SSoT Institucional de Google Cloud...
            </div>
        </main>

        <footer>
            <p>Comité Técnico Vecinal de Co-Custodia Edificio ENKA — 2026</p>
            <p style="margin-top: 0.5rem; font-size: 0.7rem">
                Bien de Interés Cultural · G.O. 39.272 · Régimen Comunidad de
                Bienes (Art. 759/762 CC)
            </p>
        </footer>
    </body>
</html>
